# 参数设置
nc: 3  # 类别数
scales: # 模型缩放
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs 


# YOLOv8 backbone with SPD-Conv
backbone:
  # [from, repeats, module, args]
  [[-1, 1, Conv, [64, 3, 1]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 1]], # 2-P2/4 非步长卷积
   [-1, 1, SPD, [1]],         # 1 空间到深度转换
   [-1, 3, C2f, [128, True]], # 3

   [-1, 1, Conv, [256, 3, 1]], # 5-P3/8 非步长卷积
   [-1, 1, SPD, [1]],         # 4 空间到深度转换
   [-1, 6, C2f, [256, True]], # 6

   [-1, 1, Conv, [512, 3, 1]], # 8-P4/16 非步长卷积
   [-1, 1, SPD, [1]],         # 7 空间到深度转换
   [-1, 6, C2f, [512, True]], # 9

   [-1, 1, Conv, [1024, 3, 1]], # 11-P5/32 非步长卷积
   [-1, 1, SPD, [1]],          # 10 空间到深度转换
   [-1, 3, C2f, [1024, True]], # 12
   [-1, 1, SPPF, [1024, 5]],  # 13
   [-1, 1, SimAM, [1024]] #14
  ]

# YOLOv8 head
head:
   [
  # [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 14 上采样
   [-1, 1, CARAFE, [512, 3, 2]], #15
   [[-1, 6], 1, Concat, [1]],  # 16 concat backbone P4
   [-1, 3, C2f, [512]], # 17

  #  [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 18 上采样
   [-1, 1, CARAFE, [256, 3, 2]],  # 18 上采样
   [[-1, 3], 1, Concat, [1]], # 19 concat backbone P3
   [-1, 3, C2f, [256]], # 20 (P3/8-small)

  #  [-1, 1, SPD, [1]],         # 20 空间到深度转换 
   [-1, 1, Conv, [256, 3, 2]], # 21 非步长卷积
   [[-1, 17], 1, Concat, [1]], # 22 concat head P4
   [-1, 3, C2f, [512]], # 23 (P4/16-medium)

  #  [-1, 1, SPD, [1]],         # 24 空间到深度转换
   [-1, 1, Conv, [512, 3, 2]], # 24 非步长卷积
   [[-1, 13], 1, Concat, [1]], # 25 concat head P5
   [-1, 3, C2f, [1024]], # 26 (P5/32-large)

   [[19, 22, 26], 1, Detect, [nc]] # Detect(P3, P4, P5)
  ]
