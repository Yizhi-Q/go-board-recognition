# YOLOv8n with CoordConv, CARAFE, and SimAM
nc: 3  # 类别数
scales: # 模型缩放
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n uses these scaling factors
  s: [0.33, 0.50, 1024]  
  m: [0.67, 0.75, 768]   
  l: [1.00, 1.00, 512]   
  x: [1.00, 1.25, 512]   

# YOLOv8n backbone with CoordConv
backbone:
  # [from, repeats, module, args]
  [[-1, 1, CoordConv, [64, 3, 2]],  # 0-P1/2
   [-1, 1, CoordConv, [128, 3, 2]], # 1-P2/4
   [-1, 3, C2f, [128, True]],       # 2

   [-1, 1, CoordConv, [256, 3, 2]], # 3-P3/8
   [-1, 6, C2f, [256, True]],       # 4

   [-1, 1, CoordConv, [512, 3, 2]], # 5-P4/16
   [-1, 6, C2f, [512, True]],       # 6

   [-1, 1, CoordConv, [1024, 3, 2]], # 7-P5/32
   [-1, 3, C2f, [1024, True]],       # 8
   [-1, 1, SPPF, [1024, 5]],         # 9
   [-1, 1, SimAM, [1024]]            # 10 - SimAM after SPPF
  ]

# YOLOv8n head with CARAFE upsampling
head:
  [
   [-1, 1, CARAFE, [512]],           # 11 - CARAFE upsampling
   [[-1, 6], 1, Concat, [1]],        # 12 concat backbone P4
   [-1, 3, C2f, [512]],              # 13

   [-1, 1, CARAFE, [256]],           # 14 - CARAFE upsampling
   [[-1, 4], 1, Concat, [1]],        # 15 concat backbone P3
   [-1, 3, C2f, [256]],              # 16 (P3/8-small)

   [-1, 1, CoordConv, [256, 3, 2]],  # 17 downsample
   [[-1, 13], 1, Concat, [1]],       # 18 concat head P4
   [-1, 3, C2f, [512]],              # 19 (P4/16-medium)

   [-1, 1, CoordConv, [512, 3, 2]],  # 20 downsample
   [[-1, 10], 1, Concat, [1]],       # 21 concat with backbone P5 after SimAM
   [-1, 3, C2f, [1024]],             # 22 (P5/32-large)

   [[16, 19, 22], 1, Detect, [nc]]   # Detect(P3, P4, P5)
  ]